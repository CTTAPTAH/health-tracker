{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}Дашборд — Health Tracker{% endblock %}

{% block content %}
    <div class="card">
        <h1>Вес</h1>
        <canvas id="weight-chart"></canvas>
        <label>
            <input type="checkbox" id="show-forecast-checkbox" checked>
            Показать прогноз
        </label>
    </div>

    <div class="card">
        <h2>Добавить вес</h2>
        <form id="add-weight-form">
            <input type="number" step="0.1" id="weight-value" placeholder="Вес, кг" required>
            <input type="date" id="weight-date" required>
            <button type="submit">Добавить</button>
            <p class="error" id="weight-error"></p>
        </form>
    </div>

    <div class="card">
        <h2>Последние записи</h2>
        <ul id="weight-list"></ul>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'frontend/js/weight_dashboard.js' %}"></script>
{% endblock %}
